name: ttd
description: "Tidy Tracker Device Mobile App"
publish_to: 'none'

#Author Burak Aydın
version: 1.1.7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.6
  get: ^4.6.5
  path_provider: ^2.0.8
  sqflite: ^2.0.1
  http: ^1.3.0
  path: ^1.8.0
  camera_android_camerax: 0.6.10+1
  sizer: ^3.0.5
  flutter_multi_formatter: ^2.12.8
  barcode_scan2: ^4.3.0
  camera: ^0.11.0+2
  image_picker: ^1.1.1
  fluttertoast: ^8.0.9
  intl: ^0.20.2
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  device_info_plus: ^11.2.2
  package_info_plus: ^8.0.1
  url_launcher: ^6.1.8


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  generate: true

  assets:
    - assets/icons.png
    - assets/1.png
    - assets/2.png
    - assets/tara.png
    - assets/photo.png
    - assets/t.png
  uses-material-design: true

